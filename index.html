<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Portal</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-hover: #334155;
      --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8;
      --border: #334155; --green: #10b981; --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .brand { padding: 20px; border-bottom: 1px solid var(--border); }
    .brand h1 { font-size: 1.1rem; }
    .brand p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .nav { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-btn {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: none; border: 1px solid transparent;
      border-radius: 6px; color: var(--muted); font-size: 0.9rem; cursor: pointer; text-align: left;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-btn.active { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.3); color: var(--accent); font-weight: 600; }
    .badge { font-size: 0.75rem; background: var(--border); padding: 2px 6px; border-radius: 10px; color: var(--muted); }
    .nav-btn.active .badge { background: var(--accent); color: var(--bg); font-weight: 700; }
    
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; margin-bottom: 12px; }
    .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s; }
    .lock-status-badge { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
    .status-pill { padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .status-pill.open { background: rgba(16,185,129,0.2); color: var(--green); }
    .status-pill.locked { background: rgba(245,158,11,0.2); color: var(--warn); }

    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type="text"] { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    .btn-group { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .filter-btn { background: none; border: none; padding: 6px 12px; color: var(--muted); cursor: pointer; font-size: 0.8rem; }
    .filter-btn.active { background: var(--border); color: var(--text); font-weight: 600; }
    .sort-btn, .parent-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .parent-btn { color: var(--accent); }

    /* Video Wrap & Year Sections */
    .grid-wrap {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: block; /* Normal block flow to avoid flexbox crushing */
    }
    
    .year-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .year-header {
      width: 100%;
      min-height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      transition: background 0.15s;
      user-select: none;
    }
    .year-header:hover { background: rgba(255, 255, 255, 0.07); }
    .year-title-group { display: flex; align-items: center; gap: 10px; }
    .year-title { color: var(--accent); font-size: 1.15rem; }
    .year-count { font-size: 0.8rem; font-weight: 500; color: var(--muted); background: var(--border); padding: 3px 10px; border-radius: 12px; }
    .year-chevron { font-size: 0.85rem; color: var(--muted); transition: transform 0.2s ease; display: inline-block; }
    .year-section.collapsed .year-chevron { transform: rotate(-90deg); }
    .year-section.collapsed .year-content { display: none; }
    
    .year-content {
      padding: 20px;
      border-top: 1px solid var(--border);
    }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card.watched { opacity: 0.7; }
    .card.watched:hover { opacity: 1; }
    .thumb { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .watched-tag { position: absolute; top: 8px; right: 8px; background: var(--green); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .lock-overlay { position: absolute; top: 8px; left: 8px; background: rgba(15,23,42,0.85); color: var(--warn); font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); }
    
    .card-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .meta .ch-name { font-weight: 600; color: var(--accent); }
    .video-title { font-size: 0.9rem; font-weight: 600; line-height: 1.35; margin-bottom: 10px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .actions { display: flex; justify-content: flex-end; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }
    .watch-btn { background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; }
    .watch-btn:hover { color: var(--text); }
    .watch-btn.is-done { color: var(--green); font-weight: bold; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { width: 100%; max-width: 900px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .modal-bar { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .iframe-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .iframe-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    
    /* Lock Notice Dialog */
    .lock-dialog { max-width: 440px; padding: 28px; text-align: center; }
    .lock-icon { font-size: 2.6rem; margin-bottom: 14px; }
    .lock-dialog h3 { font-size: 1.25rem; margin-bottom: 10px; color: var(--text); }
    .lock-dialog p.prompt-msg { font-size: 1.05rem; font-weight: 600; color: var(--accent); margin-bottom: 12px; line-height: 1.4; }
    .lock-dialog p.sub-msg { font-size: 0.85rem; color: var(--muted); margin-bottom: 22px; }
    .pin-section { border-top: 1px solid var(--border); padding-top: 18px; text-align: left; }
    .pin-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; display: block; }
    .pin-row { display: flex; gap: 8px; }
    .pin-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 1rem; text-align: center; letter-spacing: 4px; outline: none; }
    .pin-submit { background: var(--border); border: none; color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .pin-submit:hover { background: var(--accent); color: var(--bg); }
    .pin-error { color: #f87171; font-size: 0.8rem; margin-top: 6px; display: none; }

    .msg { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h1>🎬 Video Hub</h1>
      <p>Approved Channels</p>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-ch="all">
        <span>🌟 All Channels</span>
        <span class="badge" id="b-all">0</span>
      </button>
      <button class="nav-btn" data-ch="Veritasium">
        <span>🔬 Veritasium</span>
        <span class="badge" id="b-veritasium">0</span>
      </button>
      <button class="nav-btn" data-ch="Mark Rober">
        <span>🚀 Mark Rober</span>
        <span class="badge" id="b-rober">0</span>
      </button>
      <button class="nav-btn" data-ch="Nick DiGiovanni">
        <span>🍳 Nick DiGiovanni</span>
        <span class="badge" id="b-nick">0</span>
      </button>
      <button class="nav-btn" data-ch="CrunchLabs">
        <span>⚙️ CrunchLabs</span>
        <span class="badge" id="b-crunchlabs">0</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div style="display:flex; justify-content:space-between;">
        <span>Watched</span>
        <span id="stat-watched">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="stat-bar"></div></div>
      <div class="lock-status-badge">
        <span>Access:</span>
        <span class="status-pill open" id="access-pill">Checking...</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <h2 id="view-title">All Channels</h2>
      <div class="controls">
        <input type="text" id="search" placeholder="Search videos...">
        <div class="btn-group">
          <button class="filter-btn active" data-f="all">All</button>
          <button class="filter-btn" data-f="unwatched">Unwatched</button>
          <button class="filter-btn" data-f="watched">Watched</button>
        </div>
        <button class="sort-btn" id="sort-btn">Sort: <strong>Newest First</strong></button>
        <button class="parent-btn" id="open-pin-btn">🔑 Parent Unlock</button>
      </div>
    </header>

    <div class="grid-wrap" id="main-wrap">
      <div class="msg">Loading videos from Google Sheet...</div>
    </div>
  </main>

  <!-- Video Player Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-bar">
        <div class="modal-title" id="m-title">Playing Video</div>
        <button class="close-btn" id="m-close">&times;</button>
      </div>
      <div class="iframe-box">
        <iframe id="m-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
    </div>
  </div>

  <!-- Lock Notice & PIN Modal -->
  <div class="modal" id="lock-modal">
    <div class="modal-box lock-dialog">
      <div class="lock-icon">🔒</div>
      <h3>Playback Restricted</h3>
      <p class="prompt-msg" id="lock-msg">Were you useful today? Homework done? Let Aba know :-)</p>
      <p class="sub-msg" id="lock-sub">Ask Aba to unlock videos for you or enter the PIN below.</p>
      
      <div class="pin-section">
        <label class="pin-label">Parent PIN (1-Hour Pass):</label>
        <div class="pin-row">
          <input type="password" class="pin-input" id="pin-input" maxlength="8" placeholder="••••">
          <button class="pin-submit" id="pin-submit">Unlock</button>
        </div>
        <div class="pin-error" id="pin-error">Incorrect PIN. Try again.</div>
      </div>
      
      <div style="margin-top: 16px;">
        <button class="watch-btn" id="close-lock-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = "1MoK36TeB2cJdvPOPASvOnBX_XRwKcYeuiwzxnU2hMcY";
    const CHANNELS = ["Veritasium", "Mark Rober", "Nick DiGiovanni", "CrunchLabs"];

    let videos = [];
    let settings = {};
    let activeCh = "all";
    let activeFilter = "all";
    let sortDesc = true;
    let watched = new Set(JSON.parse(localStorage.getItem("watched_videos") || "[]"));

    // Default open year: current calendar year.
    const currentCalendarYear = new Date().getFullYear().toString();
    let openYears = new Set([currentCalendarYear]);

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') { field += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          row.push(field.trim()); field = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(field.trim());
          if (row.some(f => f.length > 0)) rows.push(row);
          row = []; field = '';
        } else { field += c; }
      }
      if (field || row.length) { row.push(field.trim()); if (row.some(f => f.length > 0)) rows.push(row); }
      return rows;
    }

    async function loadSettings() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Settings`;
        const res = await fetch(url);
        if (res.ok) {
          const text = await res.text();
          const rows = parseCSV(text);
          for (let i = 1; i < rows.length; i++) {
            if (rows[i][0]) {
              settings[rows[i][0].trim()] = rows[i][1] ? rows[i][1].trim() : '';
            }
          }
        }
      } catch (e) {
        console.warn("Could not load Settings tab, using defaults", e);
      }
    }

    function checkLockStatus() {
      const unlockUntil = localStorage.getItem("parent_unlock_until");
      if (unlockUntil && Date.now() < parseInt(unlockUntil)) {
        return { locked: false, reason: "Parent Override Active" };
      }

      const master = (settings["Master Status"] || "SCHEDULED").toUpperCase();
      if (master === "UNLOCKED") return { locked: false };
      if (master === "LOCKED") return { locked: true, reason: settings["Lock Message"] || "Were you useful today? Homework done? Let Aba know :-)" };

      const now = new Date();
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const dayName = days[now.getDay()];
      const timeWindow = settings[dayName];

      if (!timeWindow || timeWindow.toUpperCase() === "OFF") {
        return { locked: true, reason: `No viewing hours scheduled for ${dayName}.` };
      }

      const parts = timeWindow.split("-");
      if (parts.length === 2) {
        const [startH, startM] = parts[0].split(":").map(Number);
        const [endH, endM] = parts[1].split(":").map(Number);
        const curMins = now.getHours() * 60 + now.getMinutes();
        const startMins = startH * 60 + (startM || 0);
        const endMins = endH * 60 + (endM || 0);

        if (curMins >= startMins && curMins < endMins) {
          return { locked: false };
        } else {
          return { locked: true, reason: `Viewing hours for ${dayName} are ${parts[0]} - ${parts[1]}.` };
        }
      }

      return { locked: false };
    }

    async function loadData() {
      await loadSettings();
      updateAccessPill();

      videos = [];
      try {
        for (const ch of CHANNELS) {
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(ch)}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Could not fetch sheet data.");
          const text = await res.text();
          const rows = parseCSV(text);
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r[1] || r[1].toLowerCase() === "video id") continue;
            const rawDate = r[2] || "2026-01-01";
            const yearMatch = rawDate.match(/^\d{4}/);
            const year = yearMatch ? yearMatch[0] : "Earlier";
            videos.push({
              channel: ch,
              title: r[0] || "Untitled",
              id: r[1],
              date: rawDate,
              year: year
            });
          }
        }
        updateStats();
        render();
      } catch (e) {
        document.getElementById("main-wrap").innerHTML = `<div class="msg">Unable to load videos. Make sure the Google Sheet is shared with "Anyone with the link can view".</div>`;
      }
    }

    function updateAccessPill() {
      const lock = checkLockStatus();
      const pill = document.getElementById("access-pill");
      if (lock.locked) {
        pill.textContent = "Locked 🔒";
        pill.className = "status-pill locked";
      } else {
        pill.textContent = "Open ✓";
        pill.className = "status-pill open";
      }
    }

    function updateStats() {
      document.getElementById("b-all").textContent = videos.length;
      document.getElementById("b-veritasium").textContent = videos.filter(v => v.channel === "Veritasium").length;
      document.getElementById("b-rober").textContent = videos.filter(v => v.channel === "Mark Rober").length;
      document.getElementById("b-nick").textContent = videos.filter(v => v.channel === "Nick DiGiovanni").length;
      document.getElementById("b-crunchlabs").textContent = videos.filter(v => v.channel === "CrunchLabs").length;
      const count = videos.filter(v => watched.has(v.id)).length;
      document.getElementById("stat-watched").textContent = `${count} / ${videos.length}`;
      document.getElementById("stat-bar").style.width = videos.length ? `${(count / videos.length) * 100}%` : "0%";
    }

    function toggleWatch(id, e) {
      if (e) e.stopPropagation();
      watched.has(id) ? watched.delete(id) : watched.add(id);
      localStorage.setItem("watched_videos", JSON.stringify([...watched]));
      updateStats();
      render();
    }

    function playVideo(id, title) {
      const lock = checkLockStatus();
      if (lock.locked) {
        openLockModal(lock.reason);
        return;
      }

      document.getElementById("m-title").textContent = title;
      document.getElementById("m-frame").src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
      document.getElementById("modal").classList.add("active");
      if (!watched.has(id)) {
        watched.add(id);
        localStorage.setItem("watched_videos", JSON.stringify([...watched]));
        updateStats();
        render();
      }
    }

    function openLockModal(subText) {
      const modal = document.getElementById("lock-modal");
      const customPrompt = settings["Lock Message"] || "Were you useful today? Homework done? Let Aba know :-)";
      document.getElementById("lock-msg").textContent = customPrompt;
      if (subText && subText !== customPrompt) {
        document.getElementById("lock-sub").textContent = subText + " Ask Aba to unlock.";
      } else {
        document.getElementById("lock-sub").textContent = "Ask Aba to unlock videos for you or enter the PIN below.";
      }

      document.getElementById("pin-error").style.display = "none";
      document.getElementById("pin-input").value = "";
      modal.classList.add("active");
    }

    function submitPin() {
      const input = document.getElementById("pin-input").value.trim();
      const validPin = (settings["Parent PIN"] || "1234").trim();

      if (input === validPin) {
        localStorage.setItem("parent_unlock_until", Date.now() + 60 * 60 * 1000);
        document.getElementById("lock-modal").classList.remove("active");
        updateAccessPill();
        render();
      } else {
        document.getElementById("pin-error").style.display = "block";
      }
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
      document.getElementById("m-frame").src = "";
    }

    function toggleYear(year) {
      if (openYears.has(year)) {
        openYears.delete(year);
      } else {
        openYears.add(year);
      }
      render();
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      const lock = checkLockStatus();

      let list = videos.filter(v => {
        if (activeCh !== "all" && v.channel !== activeCh) return false;
        const isW = watched.has(v.id);
        if (activeFilter === "watched" && !isW) return false;
        if (activeFilter === "unwatched" && isW) return false;
        if (q && !v.title.toLowerCase().includes(q)) return false;
        return true;
      });

      list.sort((a, b) => sortDesc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));

      const mainWrap = document.getElementById("main-wrap");
      if (!list.length) {
        mainWrap.innerHTML = `<div class="msg">No videos found.</div>`;
        return;
      }

      // Group by year
      const yearGroups = {};
      list.forEach(v => {
        if (!yearGroups[v.year]) yearGroups[v.year] = [];
        yearGroups[v.year].push(v);
      });

      const sortedYears = Object.keys(yearGroups).sort((a, b) => sortDesc ? b.localeCompare(a) : a.localeCompare(b));

      mainWrap.innerHTML = sortedYears.map(year => {
        const isOpen = q.length > 0 || openYears.has(year);
        const vids = yearGroups[year];

        const cardsHtml = vids.map(v => {
          const isW = watched.has(v.id);
          return `
            <div class="card ${isW ? 'watched' : ''}" onclick="playVideo('${v.id}', '${v.title.replace(/'/g, "\\'")}')">
              <div class="thumb">
                <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" loading="lazy" alt="">
                ${lock.locked ? '<div class="lock-overlay">🔒 Locked</div>' : ''}
                ${isW ? '<div class="watched-tag">✓ Watched</div>' : ''}
              </div>
              <div class="card-info">
                <div class="meta">
                  <span class="ch-name">${v.channel}</span>
                  <span>${v.date}</span>
                </div>
                <div class="video-title">${v.title}</div>
                <div class="actions">
                  <button class="watch-btn ${isW ? 'is-done' : ''}" onclick="toggleWatch('${v.id}', event)">
                    ${isW ? '✓ Watched' : 'Mark as Watched'}
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section class="year-section ${isOpen ? '' : 'collapsed'}">
            <button class="year-header" onclick="toggleYear('${year}')">
              <div class="year-title-group">
                <span class="year-title">${year}</span>
                <span class="year-count">${vids.length} ${vids.length === 1 ? 'video' : 'videos'}</span>
              </div>
              <span class="year-chevron">▼</span>
            </button>
            <div class="year-content">
              <div class="video-grid">
                ${cardsHtml}
              </div>
            </div>
          </section>
        `;
      }).join('');
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCh = btn.dataset.ch;
        document.getElementById("view-title").textContent = btn.querySelector("span").textContent.trim();
        render();
      });
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.f;
        render();
      });
    });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("sort-btn").addEventListener("click", () => {
      sortDesc = !sortDesc;
      document.getElementById("sort-btn").querySelector("strong").textContent = sortDesc ? "Newest First" : "Oldest First";
      render();
    });

    document.getElementById("open-pin-btn").addEventListener("click", () => openLockModal());
    document.getElementById("pin-submit").addEventListener("click", submitPin);
    document.getElementById("pin-input").addEventListener("keydown", (e) => { if (e.key === "Enter") submitPin(); });
    document.getElementById("close-lock-btn").addEventListener("click", () => document.getElementById("lock-modal").classList.remove("active"));

    document.getElementById("m-close").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
    document.getElementById("lock-modal").addEventListener("click", e => { if (e.target.id === "lock-modal") document.getElementById("lock-modal").classList.remove("active"); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); document.getElementById("lock-modal").classList.remove("active"); } });

    loadData();
  </script>
</body>
</html>
